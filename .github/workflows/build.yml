name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate sideload keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/sideload.keystore \
            -alias soundboard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass soundboard -keypass soundboard \
            -dname "CN=Quest Soundboard, OU=Dev, O=Quest Soundboard, L=, S=, C=US"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compile (Kotlin + resources)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintRelease || true

      - name: Package Magisk module zip
        run: ./tools/build-module-zip.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-soundboard-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: quest-soundboard-magisk-module
          path: dist/*.zip
          if-no-files-found: warn

      - name: Upload Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: warn

  panel:
    name: Check control panel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check web panel
        run: node --check app/src/main/assets/web/app.js

      - name: Syntax-check shell scripts
        run: |
          for f in app/src/main/assets/magisk-module/*.sh tools/*.sh; do
            sh -n "$f" || bash -n "$f"
            echo "ok $f"
          done

      - name: Smoke-test the panel API
        run: |
          python3 tools/mock_panel.py --port 8099 &
          sleep 2
          curl -fsS localhost:8099/ > /dev/null
          curl -fsS localhost:8099/app.js > /dev/null
          curl -fsS localhost:8099/api/state | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['ok'] and d['sounds'], 'bad state payload'
          print('panel api ok:', len(d['sounds']), 'sounds')
          "
